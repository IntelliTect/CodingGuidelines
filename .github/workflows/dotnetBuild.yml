name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  automerge:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: write

    steps:
      - uses: fastify/github-action-merge-dependabot@v3.15.0
        with:
            use-github-auto-merge: true

  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: "./global.json"
        dotnet-version: |
          8.x
          9.x
          10.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -p:ContinuousIntegrationBuild=True --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal --logger trx --results-directory ./TestResults
    
    - name: Create Failed Tests Playlist
      if: failure()
      uses: BenjaminMichaelis/trx-to-vsplaylist@v4
      with:
        trx-file-path: './TestResults/*.trx'
        test-outcomes: 'Failed'
        artifact-name: 'failed-tests-playlist'

    - name: Pack Analyzer
      run: dotnet pack IntelliTect.Analyzer/IntelliTect.Analyzer/IntelliTect.Analyzer.csproj --configuration Release --no-build --output ./nupkg

    - name: Upload NuGet Package
      uses: actions/upload-artifact@v7
      with:
        name: analyzer-nupkg
        path: ./nupkg/*.nupkg

  analyzer-compat:
    name: Analyzer SDK Compat (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        sdk: ['8.0.x', '9.0.x', '10.0.x']
    steps:
    - name: Setup .NET ${{ matrix.sdk }}
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ matrix.sdk }}

    - name: Download NuGet Package
      uses: actions/download-artifact@v8
      with:
        name: analyzer-nupkg
        path: ./nupkg

    - name: Verify analyzer loads without CS9057
      run: |
        mkdir test-project && cd test-project
        $sdkPrefix = '${{ matrix.sdk }}'.Replace('x', '')
        $sdkVersion = dotnet --list-sdks |
          ForEach-Object { ($_ -split ' ')[0] } |
          Where-Object { $_.StartsWith($sdkPrefix) } |
          Sort-Object { [version]$_ } -Descending |
          Select-Object -First 1
        if (-not $sdkVersion) {
          throw "No installed SDK matches $sdkPrefix"
        }
        @{ sdk = @{ version = $sdkVersion; rollForward = 'disable' } } |
          ConvertTo-Json | Set-Content global.json
        dotnet --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet new console
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $env:NUGET_PACKAGES = Join-Path (Get-Location).Path '.nuget'
        $packageSource = (Resolve-Path ../nupkg).Path
        $pkg = Get-ChildItem ../nupkg/*.nupkg | Select-Object -First 1
        $version = [regex]::Match($pkg.Name, '(\d+\.\d+\.\d+.*)\.nupkg$').Groups[1].Value
        dotnet add package IntelliTect.Analyzers --version $version --source $packageSource
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        # Build and check for CS9057 (analyzer references newer compiler than SDK provides)
        $output = dotnet build 2>&1
        $output | Write-Output
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Build failed (exit code $LASTEXITCODE)"
          exit $LASTEXITCODE
        }
        if ($output -match 'CS9057') {
          Write-Error "CS9057 detected: Analyzer references a Roslyn version newer than this SDK supports"
          exit 1
        }
